rules:
  - id: hardcoded-socket-api-token
    message: >-
      This looks like a Socket.dev API token. Remove it from the code, revoke it
      in the Socket dashboard, and read it from an environment variable or a
      GitHub Actions secret instead.
    severity: ERROR
    languages: [generic]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: \bsktsec_[A-Za-z0-9_]{20,}

  - id: hardcoded-generic-secret
    message: >-
      A variable named like a credential is set to a string literal. Read the
      value from the environment or a secret store instead.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: const $NAME = "$VALUE"
          - pattern: let $NAME = "$VALUE"
          - pattern: var $NAME = "$VALUE"
          - pattern: '{..., $NAME: "$VALUE", ...}'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^.*(password|passwd|secret|api_?key|access_?token|auth_?token)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{8,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!<.*>$)(?!.*(example|changeme|placeholder|your)).*$
